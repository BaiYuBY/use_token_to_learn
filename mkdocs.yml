site_name: Use Token to Learn · LLM 可视化知识库
site_description: 用交互可视化学习大语言模型 / Learn LLMs through interactive visualizations
site_url: https://baiyuby.github.io/use_token_to_learn/
repo_url: https://github.com/BaiYuBY/use_token_to_learn
repo_name: BaiYuBY/use_token_to_learn
edit_uri: edit/main/docs/

docs_dir: docs
# Plain .html URLs so the built site also works when opened from disk
# 使用 .html 地址，构建出的网站可直接双击打开
use_directory_urls: false

hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: 切换暗色 / Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换亮色 / Light mode

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: zh
          name: 中文
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            总览: Overview
            核心原理: Core Concepts
            分词: Tokenization
            词嵌入: Embedding
            位置编码: Positional Encoding
            注意力机制: Attention
            Transformer 结构: Transformer Block
            训练: Training
            预训练: Pre-training
            规模定律: Scaling Laws
            微调: Fine-tuning
            对齐: Alignment
            前沿问答: Frontier Q&A
            问答首页: Q&A index
            推理强度是怎么设置的: How reasoning effort is set
            DeepInfer 是什么: What is DeepInfer
            大模型的算力怎么算: How LLM compute is counted
            CNN、RNN、KNN 与大模型: CNNs, RNNs, KNN and LLMs
            术语表: Glossary

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - 总览: index.md
  - 核心原理:
      - 分词: 01-tokenization/README.md
      - 词嵌入: 02-embedding/README.md
      - 位置编码: 03-positional-encoding/README.md
      - 注意力机制: 04-attention/README.md
      - Transformer 结构: 05-transformer/README.md
  - 训练:
      - 预训练: 06-pretraining/README.md
      - 规模定律: 07-scaling-laws/README.md
      - 微调: 08-finetuning/README.md
      - 对齐: 09-alignment/README.md
  - 前沿问答:
      - 问答首页: qa/index.md
      - 推理强度是怎么设置的: qa/reasoning-effort.md
      - DeepInfer 是什么: qa/deepinfer.md
      - 大模型的算力怎么算: qa/compute.md
      - CNN、RNN、KNN 与大模型: qa/classic-models.md
  - 术语表: glossary.md
